name: CI - Quality, Tests and QGIS 4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, agent system and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.12.23"
          enable-cache: true

      - run: uv python install
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: make flake8
      - run: make docs-check
      - run: make release-notes-check
      - run: make i18n-check
      - run: make analyzer
      - run: make mypy
      - run: uv run --frozen python .agent/tools/forge.py validate
      - run: uv run --frozen qgis-manage validate --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: qgis-analyzer-report
          path: analysis_results/
          retention-days: 7

  test:
    name: Unit tests (mock-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.12.23"
          enable-cache: true

      - run: uv python install
      - run: uv sync --frozen

      - name: Expose the plugin package for the hyphenated checkout
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-root"
          ln -sfn "$GITHUB_WORKSPACE" "$RUNNER_TEMP/plugin-root/freehand_digitize"

      - run: PYTHONPATH="$RUNNER_TEMP/plugin-root" uv run --frozen python -m unittest discover tests

  qt6:
    name: Qt6 / QGIS 4 enum check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Run PyQGIS 4 migration check
        run: |
          # Check only the packaged plugin code; the untracked upstream clone
          # and the agentic tooling are not part of the ZIP.
          mkdir -p /tmp/qt6src
          git ls-files -z core gui freehand_plugin.py __init__.py \
            | xargs -0 cp --parents -t /tmp/qt6src
          pyqt5_to_pyqt6.py --dry_run --logfile pyqt6_checker.log /tmp/qt6src
          if grep -q "Enum error" pyqt6_checker.log; then
            cat pyqt6_checker.log
            echo "::error::Qt6/PyQt6 enum incompatibilities detected."
            exit 1
          fi
          echo "No Qt6/PyQt6 enum incompatibilities detected."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pyqt6-checker-report
          path: pyqt6_checker.log
          retention-days: 7

  qgis328:
    name: Integration tests (QGIS 3.28)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Run integration tests on QGIS 3.28
        run: |
          docker run --rm -i             -v "$GITHUB_WORKSPACE:/app/freehand_digitize"             -w /app/freehand_digitize             -e QT_QPA_PLATFORM=offscreen             -e REQUIRE_QGIS=1             -e PYTHONPATH=/app:/usr/share/qgis/python             qgis/qgis:release-3_28             python3 tests/run_integration.py

  integration:
    name: Integration tests (QGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, qt6, qgis328]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Build test image
        run: DOCKER_BUILDKIT=1 docker build -t freehand_digitize_test .

      - name: Run integration tests (headless)
        run: |
          set +e
          docker run --rm freehand_digitize_test > /tmp/tests.log 2>&1
          code=$?
          set -e
          tail -20 /tmp/tests.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 139 ] && grep -qE '^OK' /tmp/tests.log && \
             ! grep -qE '^(FAILED|ERROR)' /tmp/tests.log; then
            echo "::warning::Tolerated QGIS teardown segfault (exit 139) after OK."
            exit 0
          fi
          echo "Integration run failed (exit $code)."
          exit "$code"
